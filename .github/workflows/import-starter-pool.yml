name: import-starter-pool
on:
  push:
    paths:
      - ".github/workflows/import-starter-pool.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download H3 seed mp4s and commit
        env:
          SEED_URLS_JSON: '["https://v3b.fal.media/files/b/0aa89769/GlnzGpLgN-_nDxHgv2PrR_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa8976b/_51zMuqeeN-keLsnkM6Y8_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa8976a/o7Aw-nIcJUy3UeyH91fAs_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa8976a/0V4aTj5JI1jbABQEuvD7Y_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa8976a/RkET8c_7wr-ODYieoHCmG_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa89787/_0HTe3JlWiEJ3L_qDtbjg_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa89788/t1GYxhENWTCN4TgBnjZj6_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa89788/pENILqwP4WP-C6lNdVbjT_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa89786/Yg1oBRrH4hDqKHpHPUVX9_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa8979c/U1uqEye1YEkBXDtSpLd1N_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa89793/qkOKiodiaxeRHkxJJRNvm_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa89793/BcmcI6NT2xZ9wIiWzSjNm_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa89794/VRNncFdq6yP20_7Z3_hX7_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa89793/NI7musjZRke2E4vQDjXyD_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa89793/vpqeN18d1yoHXKoZqVUOd_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa8979e/mfnw-jykOVPbaj4N-AbD8_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa8979e/Ol6tEIetSaOvJJP8bgwi__minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa8979e/7O6RfsV44GTh4p7AvjaR__minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa8979e/Xz8jqMm3rlXwO7Usc48uW_minimax-h3.mp4", "https://v3b.fal.media/files/b/0aa8979f/Ax_LTVYYNzWqxko874A4__minimax-h3.mp4"]'
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request, pathlib
          urls = json.loads(os.environ["SEED_URLS_JSON"])
          root = pathlib.Path("data/clips")
          root.mkdir(parents=True, exist_ok=True)
          for i, url in enumerate(urls):
              dest = root / ("slop-%d-0-t2v.mp4" % i)
              print("download", i)
              urllib.request.urlretrieve(url, dest)
              sz = dest.stat().st_size
              if sz < 100000:
                  raise SystemExit("too small %s %s" % (dest, sz))
              print("ok", dest.name, sz)
          PY
          git config user.email "sgmansf@gmail.com"
          git config user.name "Scott Mansfield"
          git add data/clips/*.mp4
          git rm -f --ignore-unmatch .github/workflows/import-starter-pool.yml
          git status
          if git diff --cached --quiet; then
            echo "no mp4s to commit"
            exit 0
          fi
          git commit -m "Commit the starter pool of 20 MiniMax H3 clips."
          git pull --rebase origin main
          git push origin HEAD:main
