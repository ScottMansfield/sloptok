<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLOPTOK</title>
<meta name="description" content="Dumpster-glam vertical feed of AI video slop. Not a clone.">
<meta property="og:title" content="SLOPTOK">
<meta property="og:description" content="Dumpster-glam vertical feed of AI video slop. Not a clone.">
<meta property="og:url" content="https://sloptok.dev/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.sloptok.dev">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <header class="marquee">
    <div class="bulbs" aria-hidden="true" id="bulbs"></div>
    <h1 class="wordmark">SLOPTOK</h1>
    <p class="tag">DUMPSTER-GLAM SLOT MACHINE OF SLOP</p>
  </header>
  <div class="cabinet">
    <div class="rails" aria-hidden="true"></div>
    <div class="viewport" id="viewport"></div>
    <aside class="lever-col">
      <button class="act lever" id="pull" title="spin next"><span>PULL</span></button>
      <button class="act coin" id="mute" title="sound"><span>MUTE</span></button>
      <button class="act toss" id="toss" title="next slop"><span>TOSS</span></button>
    </aside>
  </div>
  <footer class="ticket">
    <div><strong id="handle">@loading.slop</strong><p id="caption">cranking the dumpster handle…</p></div>
    <div class="pills"><span class="pill pending" id="status">WARMING UP</span><span class="pill ghost">SPIN ▲▼</span></div>
  </footer>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
