name = "sloptok"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/internal/*", "/feed.json"]

[[r2_buckets]]
binding = "CLIPS"
bucket_name = "sloptok-clips"

[[durable_objects.bindings]]
name = "CATALOG"
class_name = "Catalog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Catalog"]

[triggers]
crons = ["*/30 * * * *"]

[vars]
# Kill switch: cron refill does nothing unless this is exactly "true".
REFILL_ENABLED = "false"
DAILY_GEN_CAP = "4"
MONTHLY_GEN_CAP = "60"
MAX_PENDING = "1"
FAL_MODEL = "minimax/h3/text-to-video"
PUBLIC_URL = "https://sloptok.dev"
CDN_BASE_URL = "https://cdn.sloptok.dev"
# Secrets (wrangler secret put): FAL_KEY, ADMIN_TOKEN
